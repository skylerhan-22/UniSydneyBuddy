[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unisydneybuddy"
version = "0.1.0"
description = "A bilingual AI course briefing and project planning workspace"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "jsonschema>=4.23,<5",
  "markitdown[pdf,docx,pptx]>=0.1.1,<0.2",
  "openai>=2.26,<3",
  "streamlit>=1.37,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
